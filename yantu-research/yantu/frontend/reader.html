<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>论文阅读 · 研途</title>
    <link rel="stylesheet" href="/tokens.css?v=0.4.3" />
    <link rel="stylesheet" href="/reader.css?v=0.4.3" />
  </head>
  <body>
    <div class="paper-reader" id="paperReader">
      <header class="reader-topbar">
        <div class="document-heading">
          <button class="icon-button back-button" id="backButton" type="button" aria-label="返回资料">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <div class="document-copy">
            <span class="document-kicker">PAPER READER</span>
            <div class="document-title-row">
              <h1 id="title">正在打开论文…</h1>
              <span class="document-tag" id="documentTag">PDF</span>
            </div>
            <div class="document-meta">
              <span id="owner"></span>
              <span id="fileMeta"></span>
              <span id="progressText">正在读取页码…</span>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <span class="save-state" id="noteStatus">自动保存</span>
          <button class="toolbar-button" id="toggleNav" type="button" title="显示或隐藏目录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16" /></svg>
            <span>目录</span>
          </button>
          <button class="toolbar-button is-active" id="toggleNotes" type="button" title="显示或隐藏笔记">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg>
            <span>笔记</span>
          </button>
          <a class="toolbar-button" id="downloadLink" href="#" title="下载原始论文">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 19h16" /></svg>
            <span>下载</span>
          </a>
          <button class="icon-button" id="focusButton" type="button" title="论文专注模式" aria-label="论文专注模式">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5" /></svg>
          </button>
        </div>
      </header>

      <main class="reader-workspace">
        <aside class="navigation-panel" id="navigationPanel" aria-label="论文导航">
          <div class="panel-heading">
            <div>
              <span class="panel-kicker">DOCUMENT</span>
              <h2>论文导航</h2>
            </div>
            <button class="icon-button panel-close" id="closeNav" type="button" aria-label="关闭目录">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div class="paper-summary">
            <div class="paper-cover" id="paperCover">
              <span>PDF</span>
              <strong id="coverPageCount">—</strong>
              <small>PAGES</small>
            </div>
            <div>
              <strong id="summaryTitle">正在读取…</strong>
              <p id="summaryDescription">论文说明尚未填写</p>
            </div>
          </div>
          <nav class="panel-tabs" aria-label="导航类型">
            <button class="panel-tab is-active" type="button" data-navigation="outline">目录</button>
            <button class="panel-tab" type="button" data-navigation="pages">页面</button>
          </nav>
          <div class="navigation-content" id="navigationContent">
            <div class="panel-loading">正在读取论文结构…</div>
          </div>
          <div class="keyboard-hints">
            <strong>快捷操作</strong>
            <span><kbd>↑</kbd><kbd>↓</kbd> 翻页</span>
            <span><kbd>Ctrl</kbd><kbd>N</kbd> 笔记</span>
            <span><kbd>F</kbd> 专注</span>
          </div>
        </aside>

        <section class="paper-stage" aria-label="论文正文">
          <div class="stage-toolbar">
            <div class="page-controls">
              <button class="icon-button" id="previousPage" type="button" aria-label="上一页">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
              </button>
              <label class="page-field">
                <span class="sr-only">当前页</span>
                <input id="pageInput" type="number" min="1" value="1" />
                <span>/</span>
                <span id="pageCount">—</span>
              </label>
              <button class="icon-button" id="nextPage" type="button" aria-label="下一页">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
            </div>
            <div class="zoom-controls">
              <button class="icon-button" id="zoomOut" type="button" aria-label="缩小">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
              </button>
              <button class="zoom-value" id="zoomValue" type="button" title="恢复适合宽度">100%</button>
              <button class="icon-button" id="zoomIn" type="button" aria-label="放大">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
              <button class="fit-button" id="fitWidth" type="button">适合宽度</button>
            </div>
          </div>
          <div class="viewer-shell">
            <div class="viewer-loading" id="viewerLoading">
              <div class="loading-page">
                <span></span><span></span><span></span>
              </div>
              <p>正在加载论文页面…</p>
            </div>
            <iframe id="viewer" title="论文 PDF 阅读器"></iframe>
          </div>
          <div class="reading-progress-track" aria-hidden="true">
            <span id="readingProgressBar"></span>
          </div>
        </section>

        <aside class="notes-panel" id="notesPanel" aria-label="研究笔记">
          <div class="panel-heading notes-title">
            <div>
              <span class="panel-kicker">WORKSPACE</span>
              <h2>研究笔记</h2>
            </div>
            <button class="icon-button panel-close" id="closeNotes" type="button" aria-label="关闭笔记">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div class="note-context">
            <span id="notePageLabel">第 1 页</span>
            <button type="button" id="insertPageHeading">插入页码标题</button>
          </div>
          <textarea
            id="noteText"
            spellcheck="false"
            placeholder="记录论文的核心问题、方法、关键证据、局限和可复用思路…"
          ></textarea>
          <div class="note-footer">
            <span id="noteCount">0 字</span>
            <span>输入后自动保存</span>
          </div>
          <div class="note-prompts">
            <span class="panel-kicker">阅读提示</span>
            <button type="button" data-note-prompt="核心问题：&#10;&#10;方法：&#10;&#10;关键证据：&#10;&#10;局限与疑问：">插入结构化笔记</button>
            <button type="button" data-note-prompt="这段方法与我的研究有什么关系？&#10;&#10;">记录联想问题</button>
          </div>
          <details class="document-details">
            <summary>论文信息</summary>
            <dl>
              <div><dt>文件</dt><dd id="detailFileName">—</dd></div>
              <div><dt>大小</dt><dd id="detailFileSize">—</dd></div>
              <div><dt>版本</dt><dd id="detailVersion">—</dd></div>
              <div><dt>访问范围</dt><dd id="detailVisibility">—</dd></div>
            </dl>
          </details>
        </aside>
      </main>
      <div class="mobile-scrim" id="mobileScrim"></div>
      <div class="reader-toast" id="readerToast" role="status"></div>
      <div class="error-state" id="errorState" hidden>
        <strong>论文暂时无法打开</strong>
        <p id="errorMessage"></p>
        <button type="button" id="retryButton">重新加载</button>
      </div>
    </div>
    <script type="module" src="/reader.js"></script>
  </body>
</html>
